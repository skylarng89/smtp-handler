# Backend-only template: the caller (your server, with a secret key) supplies
# the recipient, and the project's recipient policy still applies. Browsers
# can never use it. Send with:
#   {"template":"password-reset","to":"user@customers.example",
#    "data":{"name":"Ada","url":"https://acme.example/reset/abc"}}
subject: "Reset your password"
public: false            # required for mode: request
text: |
  Hi {{.name}},

  Use this link to choose a new password: {{.url}}

  If you did not ask for this, ignore this email.

recipients:
  mode: request
