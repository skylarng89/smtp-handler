version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
        - G115 # integer conversions are bounded by validation
        - G404 # math/rand is used only for retry/poll jitter; secrets use crypto/rand
