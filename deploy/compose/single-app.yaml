# One app, one container, SQLite on a volume. Configure through .env
# (see .env.example in the repository root).
#
#   cp .env.example .env && docker compose -f deploy/compose/single-app.yaml up --build
services:
  smtp-handler:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: smtp-handler:local
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "8080:8080"                # public API: put a TLS-terminating proxy in front
      - "127.0.0.1:9090:9090"      # health, metrics, admin UI: keep internal
    volumes:
      - smtp-handler-data:/data
      - ../../templates:/templates:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s         # must exceed delivery.drain_timeout

  # Optional local SMTP sink for trying things out (http://localhost:8025).
  # Point SMTPH_SMTP_HOST=mailpit, SMTPH_SMTP_PORT=1025, SMTPH_SMTP_TLS=none.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports: ["8025:8025"]

volumes:
  smtp-handler-data:
